name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Install and build
      run: |
        npm ci
        npm run build-prod

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/docx-preview.js
          dist/docx-preview.min.js
          dist/docx-preview.mjs
          dist/docx-preview.min.mjs
          dist/docx-preview.d.ts
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
