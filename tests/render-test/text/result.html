/* Dark mode variables */

    --docx-shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.5);
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
    .docx-wrapper, .docx-wrapper * {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}

.docx-wrapper { background: var(--docx-bg-tertiary, gray); padding: 30px; padding-bottom: 0px; display: flex; flex-flow: column; align-items: center; }
.docx-wrapper>section.docx { background: var(--docx-bg-primary, white); box-shadow: var(--docx-shadow-lg, 0 0 10px rgba(0, 0, 0, 0.5)); margin-bottom: 30px; }
.docx { color: var(--docx-text-primary, black); hyphens: auto; text-underline-position: from-font; }
section.docx { box-sizing: border-box; display: flex; flex-flow: column nowrap; position: relative; overflow: hidden; }
section.docx>article { margin-bottom: auto; z-index: 1; }
section.docx>footer { z-index: 1; }
.docx table { border-collapse: collapse; }
.docx table td, .docx table th { vertical-align: top; }
.docx p { margin: 0pt; min-height: 1em; }
.docx span { white-space: pre-wrap; overflow-wrap: break-word; }
.docx a { color: inherit; text-decoration: inherit; }
.docx svg { fill: transparent; }
